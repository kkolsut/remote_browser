# Apache virtual host for the remote browser, on the site's existing reverse proxy.
# Apache terminates public TLS and forwards everything to the browser VM's Nginx over HTTPS; Nginx
# does authentication (against Authelia) and per-user routing. See docs/apache-authelia.md.
#
# Needs Apache >= 2.4.47 (upgrade=websocket) and:  a2enmod ssl proxy proxy_http headers
#
# Define these before including this file, e.g. in /etc/apache2/sites-available/remote-browser.conf:
#
#   Define RB_PUBLIC_HOST   browser.example.com
#   # The browser VM: its address and HTTPS_PORT (.env).
#   Define RB_BACKEND       192.168.10.50:8443
#   # The VM's TLS certificate (local/tls/fullchain.pem), copied here: Apache pins it.
#   Define RB_BACKEND_CERT  /etc/apache2/remote-browser/backend.pem
#   # Public certificate for RB_PUBLIC_HOST.
#   Define RB_CERT          /etc/letsencrypt/live/browser.example.com/fullchain.pem
#   Define RB_KEY           /etc/letsencrypt/live/browser.example.com/privkey.pem
#   Include /etc/apache2/remote-browser/remote-browser.conf
#
# The Docker Compose demo ran this exact file; the Ansible role in this homelab renders its own copy.

<VirtualHost *:443>
    ServerName ${RB_PUBLIC_HOST}

    SSLEngine on
    SSLCertificateFile    ${RB_CERT}
    SSLCertificateKeyFile ${RB_KEY}
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    # Nginx routes and builds the Authelia URLs from the original Host; it is also the name Apache
    # sends as SNI and checks the backend certificate against.
    ProxyPreserveHost On
    # mod_proxy_http appends the client address to X-Forwarded-For; Nginx uses only that last entry.
    RequestHeader set X-Forwarded-Proto "https"
    # Identity comes only from Authelia through Nginx (which overwrites these anyway).
    RequestHeader unset Remote-User
    RequestHeader unset Remote-Groups
    RequestHeader unset Remote-Name
    RequestHeader unset Remote-Email

    # HTTPS to the VM, pinned to its certificate.
    SSLProxyEngine            On
    SSLProxyVerify            require
    SSLProxyVerifyDepth       1
    SSLProxyCACertificateFile ${RB_BACKEND_CERT}
    SSLProxyCheckPeerName     On
    SSLProxyCheckPeerExpire   On

    # The Selkies stream is a long-lived WebSocket.
    ProxyPass        / https://${RB_BACKEND}/ upgrade=websocket timeout=3600 keepalive=On
    ProxyPassReverse / https://${RB_BACKEND}/
</VirtualHost>
