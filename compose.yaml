# Infrastructure of the browser VM: Nginx only. Authentication is the site's existing Authelia,
# public TLS the site's existing Apache reverse proxy (docs/apache-authelia.md):
#
#   client --HTTPS--> Apache (existing) --HTTPS--> Nginx (this VM) --> browser-<uid> (per-user network)
#                                                    |
#                                                    +--authz--> Authelia (existing, LAN)
#
# The per-user browser services and networks are generated from FreeIPA by
# scripts/sync-freeipa-users.py into generated/compose.users.yaml (COMPOSE_FILE in .env). The sync also
# attaches Nginx to each user's network, live: declaring those networks here would make Compose
# recreate Nginx, dropping every open stream, whenever a user is added. Hence: after anything that
# recreates Nginx (docker compose up -d after a change to it), run the sync.
# The local demo adds its own Authelia and an Apache in front (compose.demo.yaml).

name: remote-browser

services:
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      # Only the reverse proxy may connect (TRUSTED_PROXY, enforced by Nginx; restrict it in the VM
      # firewall too).
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      AUTHELIA_HOST: ${AUTHELIA_HOST:?set AUTHELIA_HOST in .env}
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
      AUTHELIA_AUTHZ_URL: ${AUTHELIA_AUTHZ_URL:?set AUTHELIA_AUTHZ_URL in .env}
      AUTHELIA_CA_FILE: ${AUTHELIA_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      TRUSTED_PROXY: ${TRUSTED_PROXY:?set TRUSTED_PROXY in .env (address of the reverse proxy)}
      # NGINX_LOCAL_RESOLVERS from /etc/resolv.conf, for the template's resolver (Docker or Podman DNS).
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      # Only these variables are substituted into nginx/templates/*.template.
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_HOST|AUTHELIA_HOST|PUBLIC_PORT|AUTHELIA_AUTHZ_URL|AUTHELIA_CA_FILE|TRUSTED_PROXY|NGINX_LOCAL_RESOLVERS)$$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/html:/usr/share/nginx/remote-browser:ro
      # User -> browser map files (*.map), see nginx.conf. Empty = nobody has a browser.
      - ${NGINX_GENERATED_DIR:-./nginx/generated}:/etc/nginx/generated:ro
      # Certificate presented to the reverse proxy, which pins it (docs/apache-authelia.md).
      - ${TLS_DIR:-./local/tls}:/etc/nginx/tls:ro
      # CA certificate(s) for an https:// AUTHELIA_AUTHZ_URL signed by a private CA
      # (then AUTHELIA_CA_FILE=/etc/nginx/authelia-ca/<file>).
      - ${AUTHELIA_CA_DIR:-./local/authelia-ca}:/etc/nginx/authelia-ca:ro
    networks:
      frontend:
        # Nginx also sits on every per-user browser network, whose traffic to the LAN is rejected
        # (plan §30a). Its default route, the way to Authelia, must be this network.
        gw_priority: 100
    security_opt:
      - no-new-privileges:true
    # Root only to start: binds 443, renders the templates, then the workers run as "nginx".
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m       # rendered templates
      - /var/cache/nginx:size=64m
      - /run:size=1m
      - /tmp:size=16m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  # The published port, and Nginx's way out to Authelia.
  frontend: {}
  # Per-user browser networks (one per user, nginx attached to each) come with the generated browser
  # services, from BROWSER_NET_POOL — never one shared network (plan §30).
