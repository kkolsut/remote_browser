# Include in every protected location, together with proxy.conf.
# Requires authelia-location.conf at server level.

auth_request /internal/authelia/authz;

# Identity comes ONLY from Authelia's response to the internal subrequest.
auth_request_set $auth_user   $upstream_http_remote_user;
auth_request_set $auth_groups $upstream_http_remote_groups;
auth_request_set $auth_name   $upstream_http_remote_name;
auth_request_set $auth_email  $upstream_http_remote_email;

# proxy_set_header replaces any client-supplied header of the same name.
proxy_set_header Remote-User   $auth_user;
proxy_set_header Remote-Groups $auth_groups;
proxy_set_header Remote-Name   $auth_name;
proxy_set_header Remote-Email  $auth_email;

# Not authenticated: Authelia answers 401 with the portal URL in Location.
auth_request_set $redirection_url $upstream_http_location;
error_page 401 =302 $redirection_url;

# Authenticated but not authorized (not in the group).
error_page 403 /_errors/403.html;
