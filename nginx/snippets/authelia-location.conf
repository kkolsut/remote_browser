# Include at server level, after setting $upstream_authelia (the authz endpoint URL). Defines the
# internal subrequest endpoint used by authelia-authrequest.conf.
# Based on https://www.authelia.com/integration/proxies/nginx/ (AuthRequest implementation).

location /internal/authelia/authz {
    internal;
    proxy_pass $upstream_authelia;

    # Required by Authelia.
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$public_port$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";

    # Never forward client-supplied identity or credential headers to the authz endpoint.
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Email "";
    proxy_set_header Remote-Name "";
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";

    proxy_pass_request_body off;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_authelia_session;
    proxy_no_cache $cookie_authelia_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;

    send_timeout 5m;
    proxy_read_timeout 240;
    proxy_send_timeout 240;
    proxy_connect_timeout 240;
}
