# Common upstream proxy settings. Nginx is the edge proxy: forwarded headers are overwritten,
# never appended to client-supplied values.

proxy_set_header Host $host;
proxy_set_header X-Original-URL $scheme://$host$request_uri;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Legacy identity header names are never used; make sure client values cannot reach a backend.
proxy_set_header X-Remote-User "";
proxy_set_header X-Remote-Groups "";
proxy_set_header X-Remote-Email "";
proxy_set_header X-Remote-Name "";

client_body_buffer_size 128k;
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
proxy_redirect http:// $scheme://;
proxy_http_version 1.1;
proxy_cache_bypass $cookie_authelia_session;
proxy_no_cache $cookie_authelia_session;
proxy_buffers 64 256k;

# Long read/send timeouts keep idle Selkies WebSocket streams open; a short connect timeout makes a
# stopped browser container fail fast (502 -> "browser starting" page).
send_timeout 5m;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_connect_timeout 10s;
