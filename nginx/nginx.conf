worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log credentials or cookies: no $http_cookie / $http_authorization in this format.
    # upstream= is the browser container that served the request (tests/routing.sh checks it).
    log_format main '$remote_addr - $auth_user_log [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time '
                    'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Default, kept explicit: headers with underscores (e.g. Remote_User) are dropped.
    underscores_in_headers off;
    ignore_invalid_headers on;

    # The resolver is set in the template (NGINX_LOCAL_RESOLVERS): Docker and Podman differ.

    # WebSocket upgrade support (Selkies).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Authenticated user for access logs; "-" when the request was not authenticated.
    map $auth_user $auth_user_log {
        default $auth_user;
        ''      '-';
    }

    # Authenticated user -> that user's browser container (plan §27). Whitelist: only users listed in
    # the generated map files get a browser. Everyone else lands on the local "no browser provisioned"
    # page (127.0.0.1:8081), never on another user's container. Map entries look like
    #     "alice" "browser-alice:3000";
    # Keys are compared case-sensitively; usernames are lowercase (plan §33).
    map $auth_user $browser_backend {
        default 127.0.0.1:8081;
        include /etc/nginx/generated/*.map;
    }

    # Only the generated server configuration; the image's stock default.conf is ignored.
    include /etc/nginx/conf.d/remote-browser.conf;
}
