# Apache of the LOCAL DEMO: stands in for the site's existing reverse proxy. It serves the browser
# vhost from apache/remote-browser.conf (the file production uses) and the demo Authelia's portal.
ServerRoot "/usr/local/apache2"
Listen 443

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule headers_module        modules/mod_headers.so
LoadModule socache_shmcb_module  modules/mod_socache_shmcb.so
LoadModule ssl_module            modules/mod_ssl.so
LoadModule proxy_module          modules/mod_proxy.so
LoadModule proxy_http_module     modules/mod_proxy_http.so

User daemon
Group daemon
ServerName localhost
ServerTokens Prod
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h \"%{X-Forwarded-For}i\" %t \"%r\" %>s %b %D" proxy
CustomLog /proc/self/fd/1 proxy
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

<Location />
    Require all granted
</Location>

# Values from compose.demo.yaml (environment). Self-signed demo certificate for both names; the same
# certificate is the browser VM's Nginx certificate, so it is also the pinned backend certificate.
Define RB_PUBLIC_HOST   ${PUBLIC_HOST}
Define RB_BACKEND       nginx:443
Define RB_BACKEND_CERT  /tls/fullchain.pem
Define RB_CERT          /tls/fullchain.pem
Define RB_KEY           /tls/privkey.pem
Include conf/remote-browser.conf

# Demo Authelia portal. In production the existing Authelia vhost; see docs/apache-authelia.md.
<VirtualHost *:443>
    ServerName ${AUTHELIA_HOST}
    SSLEngine on
    SSLCertificateFile    ${RB_CERT}
    SSLCertificateKeyFile ${RB_KEY}

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # The authz endpoints are for the browser VM's Nginx (over the LAN), not for clients.
    <Location /api/authz/>
        Require all denied
    </Location>
    ProxyPass        /api/authz/ !
    ProxyPass        / http://authelia:9091/
    ProxyPassReverse / http://authelia:9091/
</VirtualHost>
